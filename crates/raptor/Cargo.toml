[package]
name = "raptor"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Offline Rust multi-agent orchestrator: DAG planning, parallel execution, critic-gated repair, terminal chat, local Ollama and simulator."
rust-version = "1.80"

[lib]
name = "raptor"
path = "src/lib.rs"

[[bin]]
name = "raptor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
